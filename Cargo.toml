[package]
name = "arcrelay-desktop"
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
btleplug = "=0.12.0"
arcrelay-content = { version = "0.1.0", git = "https://github.com/ArcRelayProject/arcrelay-content.git", rev = "b4b24071b70b4a81e239fb6ae76ca3ac204a4d21" }
arcrelay-automation = { version = "0.1.0", git = "https://github.com/ArcRelayProject/arcrelay-automation.git", rev = "cc29e6782704a8d44d0033fbf5feeccad0d96afd", features = ["schema"] }
tokio-util = "0.7"
chrono = { version = "0.4", features = ["serde"] }
iana-time-zone = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
arcrelay-desktop-ipc = { path = "ipc-macros" }
ts-rs = { version = "12", features = ["serde-json-impl", "chrono-impl", "uuid-impl", "no-serde-warnings"] }
notify = "8"
notify-rust = "4.18.0"
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
arcrelay-core = { features = ["native"], version = "0.1.0", git = "https://github.com/ArcRelayProject/arcrelay-core.git", rev = "4b42753512a0920298c0f44dd808cd7f37f86766" }
arcrelay-files = { version = "0.1.0", git = "https://github.com/ArcRelayProject/arcrelay-files.git", rev = "694f578f2c94dc73abb3812b0b88c3d2ce0dab2f" }
arcrelay-input = { version = "0.1.0", git = "https://github.com/ArcRelayProject/arcrelay-input.git", rev = "2f3b57bac2e53cb978ea4b833617eaad9a7159f1" }
arcrelay-gaze = { version = "0.1.0", git = "https://github.com/ArcRelayProject/arcrelay-gaze.git", rev = "73ea720ca63939ec26cf66b8fa285c2a550c318b" }
arcrelay-network = { version = "0.1.0", git = "https://github.com/ArcRelayProject/arcrelay-network.git", rev = "d89e17976678182cfb3ce1d8b09fb2006b6ba1a3" }
arcrelay-peer = { version = "0.1.0", git = "https://github.com/ArcRelayProject/arcrelay-peer.git", rev = "48cd4ad8538a0b5add33877f7f9b295e78c4fce1" }
arcrelay-protocol = { version = "0.1.0", git = "https://github.com/ArcRelayProject/arcrelay-protocol.git", rev = "c498cf9f864f9bae3604d4caa73856d9935f7758" }
arcrelay-print = { version = "0.1.0", git = "https://github.com/ArcRelayProject/arcrelay-print.git", rev = "e195255e22a552591db724fb7bc6378c576c3b9d" }
arcrelay-transfer = { version = "0.1.0", git = "https://github.com/ArcRelayProject/arcrelay-transfer.git", rev = "a0310f482277d6815e1f9dc1cd0b652c48eb4b0a" }
arcrelay-transport = { version = "0.1.0", git = "https://github.com/ArcRelayProject/arcrelay-transport.git", rev = "c95846ae22ac1a4d72614a126e64ca892f390bca" }
arcrelay-wire = { version = "0.1.0", git = "https://github.com/ArcRelayProject/arcrelay-wire.git", rev = "6f5c58460439382f43489f92c572d9dc52f87e59" }
arcrelay-web-gateway = { version = "0.1.0", git = "https://github.com/ArcRelayProject/arcrelay-web-gateway.git", rev = "35b9789adb8628fb2f599060ad547c06bb6ab628" }
async-trait = "0.1"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset", "unstable"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-drag = "2.1.1"
tauri-plugin-dialog = { version = "2.6.0", default-features = false }
tauri-plugin-updater = "2.10.1"
tokio = { version = "1", features = ["fs", "io-util", "io-std", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
hostname = "0.4"
sys-locale = "0.3.2"
dirs = "6"
fs2 = "0.4"
futures-util = "0.3"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
app-info = "0.1.1"
base64 = "0.22"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
rmcp = { version = "3.1.2", features = ["macros", "schemars", "transport-streamable-http-server"] }
schemars = "1.2"
shellexpand = "3"
roxmltree = "0.20"
rfd = { version = "0.16.0", default-features = false, features = ["common-controls-v6", "tokio", "xdg-portal"] }
prost = "0.13"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.8"
rayon = "1"
qrcode = "0.14"
sha2 = "0.10"
zeroize = "1"
thiserror = "2"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
security-framework = { version = "3.7", features = ["OSX_10_15"] }
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["highsierra"] }
objc2 = "0.6"
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "LAContext", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSButton", "NSColor", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFilePromiseProvider", "NSFont", "NSGraphics", "NSImage", "NSImageView", "NSPanel", "NSPasteboard", "NSRunningApplication", "NSTextField", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace", "block2", "libc", "objc2-core-graphics", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSNotification", "NSObject", "NSOperation", "NSString", "NSURL"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "SMErrors", "objc2", "objc2-foundation"] }
tauri-nspanel = { version = "2.1.0", git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }

[target.'cfg(target_os = "windows")'.dependencies]
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
windows = { version = "0.61", features = [
    "Security_Credentials_UI",
    "Security_Cryptography",
    "Security_Cryptography_DataProtection",
    "Storage_Streams",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"

[target.'cfg(target_os = "linux")'.dependencies]
shell-words = "1.1"
x11rb = "0.13"
gdk = "0.18"
gtk = "0.18"

[build-dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
heck = "0.5"
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
arcrelay-core = { features = ["test-support"], version = "0.1.0", git = "https://github.com/ArcRelayProject/arcrelay-core.git", rev = "4b42753512a0920298c0f44dd808cd7f37f86766" }
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
