name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Require English developer-facing source
        run: ./ci/check-diagnostics-language.sh .
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run version:check
      - name: Compile macOS Share Extension
        run: >-
          xcodebuild
          -project gen/apple-macos/ArcRelay.xcodeproj
          -target ArcRelayShare
          -configuration Debug
          -sdk macosx
          -quiet
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

  windows-share-target:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 8.0.x
      - name: Compile Windows Share Target
        shell: pwsh
        run: |
          ./native/windows-share/test-packaging.ps1
          ./native/windows-share/build.ps1 -Configuration Debug -CheckOnly
