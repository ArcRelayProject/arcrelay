name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Require English developer-facing source
        run: ./ci/check-diagnostics-language.sh .
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run version:check
      - name: Compile macOS Share Extension
        run: >-
          xcodebuild
          -project gen/apple-macos/ArcRelay.xcodeproj
          -target ArcRelayShare
          -configuration Debug
          -sdk macosx
          -quiet
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
      - name: Compile macOS File Provider Extension
        run: >-
          xcodebuild
          -project gen/apple-macos/ArcRelay.xcodeproj
          -target ArcRelayFiles
          -configuration Debug
          -sdk macosx
          -quiet
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

  windows-share-target:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Compile Windows Share Target
        shell: pwsh
        run: |
          ./native/windows-share/test-packaging.ps1
          ./native/windows-share/build.ps1 -Configuration Debug -CheckOnly

  windows-share-target-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Compile Windows ARM64 Share Target
        shell: pwsh
        env:
          TARGET: aarch64-pc-windows-msvc
        run: ./native/windows-share/build.ps1 -Configuration Debug -CheckOnly
