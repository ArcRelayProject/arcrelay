name: Release desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag and package versions
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable release tags must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          node scripts/version.mjs --check "${GITHUB_REF_NAME#v}"
      - id: draft
        name: Create one draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="ArcRelay $GITHUB_REF_NAME" \
            -F draft=true \
            -F prerelease=false \
            -F generate_release_notes=true \
            --jq .id)"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            args: --bundles dmg
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: npm ci
      - name: Configure optional Apple signing
        if: matrix.platform == 'macos-15'
        shell: bash
        env:
          ARCRELAY_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          ARCRELAY_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          ARCRELAY_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ARCRELAY_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ARCRELAY_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          ARCRELAY_APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          ARCRELAY_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          write_if_set() {
            local name="$1"
            local value="$2"
            local delimiter="ARCRELAY_ENV_${RANDOM}_${RANDOM}"
            if [[ -n "$value" ]]; then
              {
                echo "${name}<<${delimiter}"
                echo "$value"
                echo "$delimiter"
              } >> "$GITHUB_ENV"
            fi
          }
          write_if_set APPLE_CERTIFICATE "$ARCRELAY_APPLE_CERTIFICATE"
          write_if_set APPLE_CERTIFICATE_PASSWORD "$ARCRELAY_APPLE_CERTIFICATE_PASSWORD"
          write_if_set APPLE_SIGNING_IDENTITY "$ARCRELAY_APPLE_SIGNING_IDENTITY"
          write_if_set APPLE_API_ISSUER "$ARCRELAY_APPLE_API_ISSUER"
          write_if_set APPLE_API_KEY "$ARCRELAY_APPLE_API_KEY"
          write_if_set APPLE_API_KEY_PATH "$ARCRELAY_APPLE_API_KEY_PATH"
          write_if_set APPLE_TEAM_ID "$ARCRELAY_APPLE_TEAM_ID"
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    needs:
      - prepare
      - build
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - name: Publish stable release after every platform succeeds
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -F prerelease=false -f make_latest=true

  cleanup:
    needs:
      - prepare
      - build
      - publish
    if: ${{ always() && needs.prepare.result == 'success' && needs.publish.result != 'success' }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - name: Remove an incomplete draft release
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
