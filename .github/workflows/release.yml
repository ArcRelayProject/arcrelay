name: Release desktop

on:
  workflow_dispatch:
    inputs:
      sniptra_release:
        description: "Optional exact Sniptra release tag (run against a stable tag)"
        type: string
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      sniptra_lock: ${{ steps.sniptra.outputs.lock }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: sniptra
        name: Lock latest compatible Sniptra release once
        env:
          GH_TOKEN: ${{ github.token }}
          SNIPTRA_RELEASE_TAG: ${{ inputs.sniptra_release || vars.SNIPTRA_RELEASE_TAG }}
        run: node scripts/sniptra-release.mjs resolve sniptra-lock.json
      - name: Require release signing credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required release credential $name is not configured."
              exit 1
            fi
          done
      - name: Verify tag and package versions
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable release tags must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          node scripts/release-channel.mjs validate-stable-version "${GITHUB_REF_NAME#v}"
          node scripts/version.mjs --check "${GITHUB_REF_NAME#v}"
      - id: draft
        name: Create one draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="ArcRelay $GITHUB_REF_NAME" \
            -F draft=true \
            -F prerelease=false \
            -F generate_release_notes=true \
            --jq .id)"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-15
            os: macos
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS Intel
            platform: macos-15-intel
            os: macos
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: Windows x86-64
            platform: windows-latest
            os: windows
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
          - name: Windows ARM64
            platform: windows-11-arm
            os: windows
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Download and verify locked Sniptra component
        env:
          SNIPTRA_LOCK: ${{ needs.prepare.outputs.sniptra_lock }}
        shell: bash
        run: |
          printf '%s\n' "$SNIPTRA_LOCK" > sniptra-lock.json
          node scripts/sniptra-release.mjs download sniptra-lock.json "${{ matrix.target }}"
      - run: npm ci
      - name: Import Apple signing certificate
        if: matrix.os == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: scripts/import-apple-signing-certificate.sh
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        with:
          tauriScript: npm run tauri
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true
          args: --config tauri.github.conf.json ${{ matrix.args }}
      - name: Verify signed and notarized macOS package
        if: matrix.os == 'macos'
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          dmg_path="$(find target -type f -path '*/release/bundle/dmg/*.dmg' | head -n 1)"
          test -n "$dmg_path"
          codesign --verify --strict --verbose=4 "$dmg_path"

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir"
            rmdir "$mount_dir"
          }
          trap cleanup EXIT
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir"
          app_path="$mount_dir/ArcRelay.app"
          test -d "$app_path"
          codesign --verify --deep --strict --verbose=4 "$app_path"
          codesign -d --verbose=4 "$app_path" 2>&1 | grep -F "Authority=$APPLE_SIGNING_IDENTITY"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
      - name: Remove temporary Apple signing keychain
        if: always() && matrix.os == 'macos'
        run: scripts/cleanup-apple-signing-certificate.sh

  publish:
    needs:
      - prepare
      - build
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preserve exact Sniptra dependency manifest
        env:
          SNIPTRA_LOCK: ${{ needs.prepare.outputs.sniptra_lock }}
        run: |
          printf '%s\n' "$SNIPTRA_LOCK" > sniptra-lock.json
          gh release upload "${{ github.ref_name }}" sniptra-lock.json --repo "$GITHUB_REPOSITORY"
      - name: Generate one updater manifest after every build succeeds
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${EXPECTED_VERSION#v}"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release.json
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > release-assets.json
          mkdir updater-signatures
          while IFS=$'\t' read -r asset_url asset_name; do
            case "$asset_name" in
              */*|*\\*|.|..)
                echo "::error::Invalid release asset name: $asset_name"
                exit 1
                ;;
            esac
            gh api -H 'Accept: application/octet-stream' "$asset_url" > "updater-signatures/$asset_name"
          done < <(jq -r '.[] | select(.name | endswith(".sig")) | [.url, .name] | @tsv' release-assets.json)
          node scripts/generate-updater-manifest.mjs \
            release.json release-assets.json updater-signatures latest.json "$version"
          gh release upload "$RELEASE_TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
      - name: Validate signed updater manifest
        run: |
          node scripts/release-channel.mjs validate-manifest latest.json "${GITHUB_REF_NAME#v}" 'darwin-aarch64,darwin-x86_64,windows-x86_64,windows-aarch64'
      - name: Cryptographically verify updater packages
        run: scripts/verify-updater-assets.sh latest.json 'darwin-aarch64,darwin-x86_64,windows-x86_64,windows-aarch64'
      - name: Publish stable release after every platform succeeds
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -F prerelease=false -f make_latest=true

  cleanup:
    needs:
      - prepare
      - build
      - publish
    if: ${{ always() && needs.prepare.result == 'success' && needs.publish.result != 'success' }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - name: Remove an incomplete draft release
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
