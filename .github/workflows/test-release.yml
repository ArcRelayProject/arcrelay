name: Test release

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: desktop-test-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  metadata:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      release_id: ${{ steps.draft.outputs.release_id }}
      short_commit: ${{ steps.release.outputs.short_commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Require release signing credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required release credential $name is not configured."
              exit 1
            fi
          done
      - id: release
        name: Define test release
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          short_commit="$(git rev-parse --short=12 HEAD)"
          base_version="$(node -p "require('./package.json').version")"
          version="$(node scripts/release-channel.mjs test-version "$base_version" "$GITHUB_RUN_NUMBER")"
          {
            echo "commit=${commit}"
            echo "short_commit=${short_commit}"
            echo "tag=test-v${version}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
      - id: draft
        name: Create one draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_NAME: ArcRelay Test ${{ steps.release.outputs.tag }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_BODY: |
            Automated test build from `${{ steps.release.outputs.short_commit }}` on `main`.

            This signed prerelease follows the Test update channel and may be unstable.
        run: |
          release_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$RELEASE_COMMIT" \
            -f name="$RELEASE_NAME" \
            -f body="$RELEASE_BODY" \
            -F draft=true \
            -F prerelease=true \
            --jq .id)"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            args: --bundles app,dmg
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: npm ci
      - name: Set test package version
        run: node scripts/version.mjs "${{ needs.metadata.outputs.version }}"
      - name: Import Apple signing certificate
        if: matrix.platform == 'macos-15'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: scripts/import-apple-signing-certificate.sh
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        with:
          tauriScript: npm run tauri
          releaseId: ${{ needs.metadata.outputs.release_id }}
          tagName: ${{ needs.metadata.outputs.tag }}
          releaseDraft: true
          prerelease: true
          updaterJsonPreferNsis: true
          args: --config tauri.github.conf.json ${{ matrix.args }}
      - name: Verify signed and notarized macOS package
        if: matrix.platform == 'macos-15'
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          dmg_path="$(find target -type f -path '*/release/bundle/dmg/*.dmg' | head -n 1)"
          test -n "$dmg_path"
          codesign --verify --strict --verbose=4 "$dmg_path"

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir"
            rmdir "$mount_dir"
          }
          trap cleanup EXIT
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir"
          app_path="$mount_dir/ArcRelay.app"
          test -d "$app_path"
          codesign --verify --deep --strict --verbose=4 "$app_path"
          codesign -d --verbose=4 "$app_path" 2>&1 | grep -F "Authority=$APPLE_SIGNING_IDENTITY"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
      - name: Remove temporary Apple signing keychain
        if: always() && matrix.platform == 'macos-15'
        run: scripts/cleanup-apple-signing-certificate.sh

  publish:
    needs:
      - metadata
      - build
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.metadata.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - name: Validate signed updater manifest
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          asset_api="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[] | select(.name == "latest.json") | .url')"
          test -n "$asset_api"
          gh api -H 'Accept: application/octet-stream' "$asset_api" > latest.json
          node scripts/release-channel.mjs validate-manifest latest.json "$EXPECTED_VERSION" 'darwin-aarch64,windows-x86_64'
      - name: Cryptographically verify updater packages
        run: scripts/verify-updater-assets.sh latest.json 'darwin-aarch64,windows-x86_64'
      - name: Publish prerelease and advance Test channel
        env:
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -F prerelease=true -f make_latest=false
          if ! channel_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/updater-test" --jq .id 2>/dev/null)"; then
            channel_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name=updater-test \
              -f target_commitish="$RELEASE_COMMIT" \
              -f name='ArcRelay Test update channel' \
              -f body='Machine-readable pointer used by ArcRelay Test channel clients.' \
              -F draft=false \
              -F prerelease=true \
              --jq .id)"
          fi
          existing_asset="$(gh api "repos/$GITHUB_REPOSITORY/releases/$channel_id/assets" --jq '.[] | select(.name == "latest.json") | .id' | head -n 1)"
          if [[ -n "$existing_asset" ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$existing_asset"
          fi
          gh release upload updater-test latest.json --repo "$GITHUB_REPOSITORY"

  cleanup:
    needs:
      - metadata
      - build
      - publish
    if: ${{ always() && needs.metadata.result == 'success' && needs.publish.result != 'success' }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.metadata.outputs.release_id }}
    steps:
      - name: Remove an incomplete draft release
        run: |
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft)" == true ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          fi
