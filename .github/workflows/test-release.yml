name: Test release

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: desktop-test-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  metadata:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      release_id: ${{ steps.draft.outputs.release_id }}
      short_commit: ${{ steps.release.outputs.short_commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: release
        name: Define test release
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          short_commit="$(git rev-parse --short=12 HEAD)"
          version="$(node -p "require('./package.json').version")"
          {
            echo "commit=${commit}"
            echo "short_commit=${short_commit}"
            echo "tag=test-v${version}.${GITHUB_RUN_NUMBER}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
      - id: draft
        name: Create one draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_NAME: ArcRelay Test ${{ steps.release.outputs.tag }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_BODY: |
            Automated test build from `${{ steps.release.outputs.short_commit }}` on `main`.

            This prerelease is intended for testing and may be unsigned or unstable.
        run: |
          release_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$RELEASE_COMMIT" \
            -f name="$RELEASE_NAME" \
            -f body="$RELEASE_BODY" \
            -F draft=true \
            -F prerelease=true \
            --jq .id)"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            args: --bundles dmg
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: npm ci
      - name: Configure optional Apple signing
        if: matrix.platform == 'macos-15'
        shell: bash
        env:
          ARCRELAY_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          ARCRELAY_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          ARCRELAY_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ARCRELAY_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ARCRELAY_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          ARCRELAY_APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          ARCRELAY_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          write_if_set() {
            local name="$1"
            local value="$2"
            local delimiter="ARCRELAY_ENV_${RANDOM}_${RANDOM}"
            if [[ -n "$value" ]]; then
              {
                echo "${name}<<${delimiter}"
                echo "$value"
                echo "$delimiter"
              } >> "$GITHUB_ENV"
            fi
          }
          write_if_set APPLE_CERTIFICATE "$ARCRELAY_APPLE_CERTIFICATE"
          write_if_set APPLE_CERTIFICATE_PASSWORD "$ARCRELAY_APPLE_CERTIFICATE_PASSWORD"
          write_if_set APPLE_SIGNING_IDENTITY "$ARCRELAY_APPLE_SIGNING_IDENTITY"
          write_if_set APPLE_API_ISSUER "$ARCRELAY_APPLE_API_ISSUER"
          write_if_set APPLE_API_KEY "$ARCRELAY_APPLE_API_KEY"
          write_if_set APPLE_API_KEY_PATH "$ARCRELAY_APPLE_API_KEY_PATH"
          write_if_set APPLE_TEAM_ID "$ARCRELAY_APPLE_TEAM_ID"
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri
          releaseId: ${{ needs.metadata.outputs.release_id }}
          tagName: ${{ needs.metadata.outputs.tag }}
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

  publish:
    needs:
      - metadata
      - build
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.metadata.outputs.release_id }}
    steps:
      - name: Publish prerelease after every platform succeeds
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -F prerelease=true -f make_latest=false

  cleanup:
    needs:
      - metadata
      - build
      - publish
    if: ${{ always() && needs.metadata.result == 'success' && needs.publish.result != 'success' }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.metadata.outputs.release_id }}
    steps:
      - name: Remove an incomplete draft release
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
