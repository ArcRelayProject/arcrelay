name: Trusted maintainer auto-merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_run:
    workflows: [CI, CLA, Dependency review]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: trusted-maintainer-auto-merge
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      # Privileged workflow: only execute repository-owned default-branch code.
      # Never check out a PR head or consume artifacts from a PR workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Configure protected auto-merge for trusted maintainers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/trusted_auto_merge.py
