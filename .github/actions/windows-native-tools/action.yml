name: Windows native tools
description: Install the CMake and architecture-specific assembler required by native Rust dependencies.
inputs:
  target:
    description: Windows Rust target triple to build.
    required: false
    default: x86_64-pc-windows-msvc
runs:
  using: composite
  steps:
    # libjpeg-turbo uses NASM only for its x86 SIMD sources; ARM64 uses NEON.
    - name: Install NASM for Windows x86-64
      if: inputs.target == 'x86_64-pc-windows-msvc'
      shell: pwsh
      run: |
        choco install nasm --yes --no-progress
        if ($LASTEXITCODE -ne 0) { throw "NASM installation failed: $LASTEXITCODE" }
        $env:Path = @(
          $env:Path
          [Environment]::GetEnvironmentVariable('Path', 'Machine')
          [Environment]::GetEnvironmentVariable('Path', 'User')
        ) -join ';'
        if (-not (Get-Command nasm.exe -ErrorAction SilentlyContinue)) {
          # NASM's installer records its directory but does not add it to PATH.
          $nasmDirectory = (Get-Item 'HKCU:\Software\nasm' -ErrorAction Stop).GetValue('')
          $env:Path = "$nasmDirectory;$env:Path"
        }
        $nasmExecutable = (Get-Command nasm.exe -CommandType Application -ErrorAction Stop).Source
        Split-Path $nasmExecutable | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & $nasmExecutable -v
        if ($LASTEXITCODE -ne 0) { throw "NASM verification failed: $LASTEXITCODE" }
    - name: Install CMake with Visual Studio 2026 support
      shell: pwsh
      run: |
        # VS 2026 requires CMake >= 4.2; select the executable explicitly so an
        # older runner/Visual Studio copy earlier on PATH cannot shadow it.
        python -m pip install --disable-pip-version-check --only-binary=:all: cmake==4.2.3
        if ($LASTEXITCODE -ne 0) { throw "CMake installation failed: $LASTEXITCODE" }
        $cmakeDirectory = python -c "import cmake; print(cmake.CMAKE_BIN_DIR)"
        if ($LASTEXITCODE -ne 0) { throw "CMake directory lookup failed: $LASTEXITCODE" }
        $env:CMAKE = Join-Path $cmakeDirectory 'cmake.exe'
        $cmakeCapabilities = & $env:CMAKE -E capabilities | ConvertFrom-Json
        if ($LASTEXITCODE -ne 0 -or 'Visual Studio 18 2026' -notin $cmakeCapabilities.generators.name) {
          throw 'Installed CMake does not support the Visual Studio 2026 generator'
        }
        $cmakeDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "CMAKE=$env:CMAKE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        & $env:CMAKE --version
